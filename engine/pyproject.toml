# @author lxy
[project]
name = "dev-copilot-engine"
version = "0.1.0"
description = "AI 研发助手（Dev Copilot）Agent 引擎 —— FastAPI + LangGraph + Redis"
readme = "../README.md"
requires-python = ">=3.12"
authors = [{ name = "lxy" }]

dependencies = [
    # Web 框架与服务器
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    # HTTP 客户端
    "httpx>=0.27.0",
    # Redis 异步客户端（hiredis 加速解析）
    "redis[hiredis]>=5.0.0",
    # LangChain / LangGraph 生态
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    # 数据校验与配置
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    # 日志
    "loguru>=0.7.0",
    # 向量检索（RAG 知识库）
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",
    "langchain-text-splitters>=0.3.0",
    # MCP 协议
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
