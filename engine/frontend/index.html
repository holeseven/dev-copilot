<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Copilot - AI 研发助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eaeaea;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #16213e;
            padding: 16px 24px;
            border-bottom: 1px solid #0f3460;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        header h1 {
            font-size: 1.2rem;
            color: #00d4ff;
            font-weight: 600;
        }
        header .status {
            font-size: 0.75rem;
            color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
            padding: 2px 8px;
            border-radius: 10px;
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.9rem;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .msg.user {
            align-self: flex-end;
            background: #0f3460;
            color: #e0e0e0;
            border-bottom-right-radius: 4px;
        }
        .msg.assistant {
            align-self: flex-start;
            background: #1e2a4a;
            color: #f0f0f0;
            border-bottom-left-radius: 4px;
        }
        .msg.tool-call {
            align-self: flex-start;
            background: rgba(255, 193, 7, 0.1);
            border: 1px solid rgba(255, 193, 7, 0.3);
            color: #ffc107;
            font-size: 0.8rem;
            font-family: 'Fira Code', monospace;
        }
        .msg.error {
            align-self: center;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #ef4444;
        }
        .approval-box {
            align-self: flex-start;
            background: rgba(251, 146, 60, 0.1);
            border: 1px solid rgba(251, 146, 60, 0.5);
            padding: 16px;
            border-radius: 12px;
            max-width: 80%;
        }
        .approval-box h4 {
            color: #fb923c;
            margin-bottom: 8px;
        }
        .approval-box p {
            font-size: 0.85rem;
            margin-bottom: 12px;
            color: #d1d5db;
        }
        .approval-box .btn-group {
            display: flex;
            gap: 8px;
        }
        .approval-box button {
            padding: 6px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: opacity 0.2s;
        }
        .approval-box button:hover { opacity: 0.85; }
        .btn-approve { background: #4ade80; color: #1a1a2e; }
        .btn-reject { background: #ef4444; color: #fff; }
        #input-area {
            padding: 16px 24px;
            background: #16213e;
            border-top: 1px solid #0f3460;
            display: flex;
            gap: 10px;
        }
        #input-area input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #0f3460;
            background: #1a1a2e;
            color: #eaeaea;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        #input-area input:focus { border-color: #00d4ff; }
        #input-area button {
            padding: 12px 24px;
            background: #00d4ff;
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        #input-area button:hover { background: #00b8d4; }
        #input-area button:disabled {
            background: #4a5568;
            cursor: not-allowed;
        }
        .typing-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #00d4ff;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Dev Copilot</h1>
        <span class="status" id="status-badge">● 已连接</span>
    </header>

    <div id="messages"></div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="输入消息... (Enter 发送)" autocomplete="off" />
        <button id="send-btn" onclick="sendMessage()">发送</button>
    </div>

    <script>
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const statusBadge = document.getElementById('status-badge');

        let sessionId = 'session-' + Date.now().toString(36);
        let currentAssistantEl = null;
        let isStreaming = false;

        // Enter 键发送
        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function sendMessage() {
            const text = inputEl.value.trim();
            if (!text || isStreaming) return;

            appendMessage('user', text);
            inputEl.value = '';
            startStreaming(text);
        }

        function startStreaming(message) {
            isStreaming = true;
            sendBtn.disabled = true;
            statusBadge.textContent = '● 生成中...';
            statusBadge.style.color = '#fbbf24';

            // 创建助手消息占位
            currentAssistantEl = appendMessage('assistant', '');
            const indicator = document.createElement('span');
            indicator.className = 'typing-indicator';
            currentAssistantEl.appendChild(indicator);

            fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message, session_id: sessionId }),
            }).then(response => {
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let firstToken = true;

                function pump() {
                    return reader.read().then(({ done, value }) => {
                        if (done) {
                            finishStreaming();
                            return;
                        }
                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop() || '';

                        for (const line of lines) {
                            if (line.startsWith('event: ')) {
                                handleEvent(line);
                            } else if (line.startsWith('data: ')) {
                                handleData(line, firstToken);
                                firstToken = false;
                            }
                        }
                        return pump();
                    });
                }

                let currentEvent = '';

                function handleEvent(line) {
                    currentEvent = line.slice(7).trim();
                }

                function handleData(line, isFirst) {
                    const raw = line.slice(6);
                    let data;
                    try { data = JSON.parse(raw); } catch { data = raw; }

                    if (currentEvent === 'message' && data.token) {
                        if (isFirst && currentAssistantEl) {
                            // 移除 typing indicator
                            const ind = currentAssistantEl.querySelector('.typing-indicator');
                            if (ind) ind.remove();
                        }
                        if (currentAssistantEl) {
                            currentAssistantEl.textContent += data.token;
                            scrollToBottom();
                        }
                    } else if (currentEvent === 'tool') {
                        const toolMsg = data.status === 'start'
                            ? `🔧 调用工具: ${data.tool_name}`
                            : `✅ 工具完成: ${data.tool_name}`;
                        appendMessage('tool-call', toolMsg);
                    } else if (currentEvent === 'approval_required') {
                        showApprovalDialog(data);
                    } else if (currentEvent === 'error') {
                        appendMessage('error', `❌ ${data.message || data}`);
                    } else if (currentEvent === 'done') {
                        finishStreaming();
                    }
                }

                return pump();
            }).catch(err => {
                appendMessage('error', `❌ 网络错误: ${err.message}`);
                finishStreaming();
            });
        }

        function finishStreaming() {
            isStreaming = false;
            sendBtn.disabled = false;
            statusBadge.textContent = '● 已连接';
            statusBadge.style.color = '#4ade80';
            currentAssistantEl = null;
            // 移除残留的 typing indicator
            document.querySelectorAll('.typing-indicator').forEach(el => el.remove());
        }

        function appendMessage(type, text) {
            const el = document.createElement('div');
            el.className = `msg ${type}`;
            el.textContent = text;
            messagesEl.appendChild(el);
            scrollToBottom();
            return el;
        }

        function showApprovalDialog(data) {
            const box = document.createElement('div');
            box.className = 'approval-box';
            box.innerHTML = `
                <h4>⚠️ 需要审批</h4>
                <p><strong>操作:</strong> ${data.action || '未知'}</p>
                <p>${data.message || ''}</p>
                <p style="font-size:0.8rem;color:#9ca3af;">${data.details || ''}</p>
                <div class="btn-group">
                    <button class="btn-approve" onclick="handleApproval(this, true)">✓ 批准</button>
                    <button class="btn-reject" onclick="handleApproval(this, false)">✗ 拒绝</button>
                </div>
            `;
            messagesEl.appendChild(box);
            scrollToBottom();
        }

        function handleApproval(btn, approved) {
            const box = btn.closest('.approval-box');
            const buttons = box.querySelectorAll('button');
            buttons.forEach(b => b.disabled = true);

            const reason = approved ? '' : (prompt('请输入拒绝原因（可选）:') || '');

            fetch('/chat/resume', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    thread_id: sessionId,
                    approved,
                    reason,
                }),
            }).then(response => {
                box.innerHTML += `<p style="margin-top:8px;color:${approved ? '#4ade80' : '#ef4444'};">
                    ${approved ? '✓ 已批准' : '✗ 已拒绝'}${reason ? ' - ' + reason : ''}</p>`;

                if (response.ok) {
                    // 继续消费恢复流
                    currentAssistantEl = appendMessage('assistant', '');
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';
                    let currentEvent = '';

                    function pump() {
                        return reader.read().then(({ done, value }) => {
                            if (done) { finishStreaming(); return; }
                            buffer += decoder.decode(value, { stream: true });
                            const lines = buffer.split('\n');
                            buffer = lines.pop() || '';
                            for (const line of lines) {
                                if (line.startsWith('event: ')) {
                                    currentEvent = line.slice(7).trim();
                                } else if (line.startsWith('data: ')) {
                                    let d; try { d = JSON.parse(line.slice(6)); } catch { d = {}; }
                                    if (currentEvent === 'message' && d.token && currentAssistantEl) {
                                        currentAssistantEl.textContent += d.token;
                                        scrollToBottom();
                                    } else if (currentEvent === 'done') {
                                        finishStreaming();
                                    }
                                }
                            }
                            return pump();
                        });
                    }
                    pump();
                }
            }).catch(err => {
                appendMessage('error', `❌ 审批请求失败: ${err.message}`);
            });
        }

        function scrollToBottom() {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        // 初始欢迎消息
        appendMessage('assistant', '你好！我是 Dev Copilot，你的 AI 研发助手。有什么可以帮你的？');
    </script>
</body>
</html>
