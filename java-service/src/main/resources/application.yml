# Agent 数据服务配置
# @author lxy
# @date 2026-08-26

server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: agent-data-service

  # 数据源配置（HikariCP 连接池）
  datasource:
    url: jdbc:mysql://localhost:3306/agent_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 10000
      pool-name: AgentHikariPool

  # Redis 配置（与 Python 引擎共享同一实例）
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 驼峰转下划线映射
    map-underscore-to-camel-case: true
    # 日志输出（开发环境）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 逻辑删除字段配置
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      # 主键策略：雪花算法
      id-type: assign_id
    banner: false

# 日志配置
logging:
  level:
    com.agent: DEBUG
    com.baomidou: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
