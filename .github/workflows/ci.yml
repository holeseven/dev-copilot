# @author lxy
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - name: Install frozen Python dependencies
        run: uv sync --project engine --frozen --extra dev

      - name: Set up Node.js 20.19
        uses: actions/setup-node@v7
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Web dependencies
        run: npm ci
        working-directory: web

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: java-service/pom.xml

      - name: Run cross-stack verification
        run: python scripts/verify.py

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate and build container releases
        env:
          DEV_COPILOT_ALLOWED_ROOT: ${{ github.workspace }}
          DEV_COPILOT_MYSQL_ROOT_PASSWORD: ci-only-root-password
          DEV_COPILOT_DB_PASSWORD: ci-only-app-password
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.write.yml config --quiet
          docker compose build engine java-service web
          docker compose -f docker-compose.yml -f docker-compose.write.yml build engine
