# @author lxy
# Dev Copilot 一键启动：Redis + Python 引擎 +（Java 数据服务占位）
version: "3.9"

services:
  # ===== Redis：记忆存储 / CAS 抢占锁 / 任务队列 / 动态配置 =====
  redis:
    image: redis:7-alpine
    container_name: dev-copilot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===== Python Agent 引擎（核心）=====
  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: dev-copilot-engine
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 容器内通过服务名访问 Redis
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  # ===== Java 数据服务（占位：后续任务实现 Spring Boot + MyBatis-Plus）=====
  # java-service:
  #   build:
  #     context: ./java-service
  #   container_name: dev-copilot-java
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     - redis

volumes:
  redis-data:
