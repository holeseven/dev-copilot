# @author lxy
# Local-only deployment. Copy .env.example to .env and provide every required value.

services:
  redis:
    image: redis:7-alpine
    container_name: dev-copilot-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mysql:
    image: mysql:8.0
    container_name: dev-copilot-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${DEV_COPILOT_MYSQL_ROOT_PASSWORD:?required}"
      MYSQL_DATABASE: agent_db
      MYSQL_USER: "${DEV_COPILOT_DB_USERNAME:-dev_copilot}"
      MYSQL_PASSWORD: "${DEV_COPILOT_DB_PASSWORD:?required}"
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./java-service/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10

  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: dev-copilot-engine
    read_only: true
    tmpfs:
      - /tmp
    environment:
      REDIS_URL: redis://redis:6379/0
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.deepseek.com/v1}"
      LLM_MODEL: "${LLM_MODEL:-deepseek-chat}"
      LLM_MODEL_L2: "${LLM_MODEL_L2:-}"
      LLM_TEMPERATURE: "${LLM_TEMPERATURE:-0.7}"
      LLM_TIMEOUT: "${LLM_TIMEOUT:-60}"
      REDIS_MAX_CONNECTIONS: "${REDIS_MAX_CONNECTIONS:-20}"
      DYNAMIC_CONFIG_KEY: "${DYNAMIC_CONFIG_KEY:-dev_copilot:config}"
      CONFIG_REFRESH_INTERVAL: "${CONFIG_REFRESH_INTERVAL:-30}"
      APP_NAME: "${APP_NAME:-dev-copilot-engine}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      WORKSPACE_ALLOWED_ROOTS: '["/workspace"]'
      WORKSPACE_METADATA_DIR: /data/dev-copilot
      CHECKPOINT_DB_PATH: "${CHECKPOINT_DB_PATH:-/data/dev-copilot/checkpoints.sqlite3}"
      PROPOSAL_DB_PATH: "${PROPOSAL_DB_PATH:-/data/dev-copilot/proposals.sqlite3}"
      RAG_DB_PATH: "${RAG_DB_PATH:-/data/dev-copilot/rag.sqlite3}"
    volumes:
      - type: bind
        source: "${DEV_COPILOT_ALLOWED_ROOT:?required}"
        target: /workspace
        read_only: true
      - type: volume
        source: engine-metadata
        target: /data/dev-copilot
    networks:
      - backend
      - egress
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy

  java-service:
    build:
      context: ./java-service
      dockerfile: Dockerfile
    container_name: dev-copilot-java
    ports:
      - "127.0.0.1:8081:8081"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/agent_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: "${DEV_COPILOT_DB_USERNAME:-dev_copilot}"
      SPRING_DATASOURCE_PASSWORD: "${DEV_COPILOT_DB_PASSWORD:?required}"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      DEV_COPILOT_ENGINE_BASE_URL: http://engine:8000
    networks:
      - backend
      - frontend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      engine:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: dev-copilot-web
    ports:
      - "127.0.0.1:3000:8080"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      JAVA_BASE_URL: http://java-service:8081
      PORT: 8080
    networks:
      - frontend
    depends_on:
      java-service:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/').then(r=>{if(!r.ok)process.exit(1)})"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  redis-data:
  mysql-data:
  engine-metadata:

networks:
  backend:
    internal: true
  frontend:
  egress:
